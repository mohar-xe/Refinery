[project]
name = "refinery"
version = "0.1.0"
description = "Agent-trajectory data refinery: verified trajectories in, a small distilled model out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mohar-xe" }]

# Runtime deps are intentionally minimal. The pipeline must run on a CPU-only
# box with no GPU, no torch, and no network except the teacher API.
dependencies = [
  "httpx>=0.27",
  "pyarrow>=17",   # read the public NLI parquet shards
]

[project.optional-dependencies]
# Training the toy-scale student needs torch (CPU wheels). Full-scale runs use
# Unsloth/TRL on a rented GPU instead; same trainer entrypoint, different config.
train = ["torch>=2.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
refinery = "refinery.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["refinery*", "evalkit*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
